name: Android debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: accorps-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p /tmp/audio-test
          javac -d /tmp/audio-test app/src/main/java/fr/orbivia/accorps/Dsp.java app/src/main/java/fr/orbivia/accorps/AudioChannels.java app/src/main/java/fr/orbivia/accorps/Wav.java app/src/main/java/fr/orbivia/accorps/ScopeHistory.java app/src/main/java/fr/orbivia/accorps/PitchShifter.java tests/PitchShifterTest.java tests/AudioCoreTest.java tests/ScopeHistoryTest.java
          java -cp /tmp/audio-test AudioCoreTest
          java -cp /tmp/audio-test ScopeHistoryTest
          java -cp /tmp/audio-test PitchShifterTest
      - run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Show lint report on failure
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt || true
      - name: Publish APK in dedicated private test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create accorps-test-0.7.0-20261120 app/build/outputs/apk/debug/app-debug.apk --draft=false --latest=false --target "${{ github.sha }}" --title "AcCorps 0.7.0 - Scope and Pitch prototype" --notes "Experimental build: larger 6-second scope, quick heart/lungs modes, adjustable monitoring pitch x1-x5 and mix; unprocessed WAV preserved. Not clinically validated."
      - name: Verify APK checksum
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
