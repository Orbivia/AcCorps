name: Android debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p /tmp/audio-test
          javac -d /tmp/audio-test app/src/main/java/fr/orbivia/accorps/Dsp.java app/src/main/java/fr/orbivia/accorps/AudioChannels.java app/src/main/java/fr/orbivia/accorps/Wav.java app/src/main/java/fr/orbivia/accorps/ScopeHistory.java app/src/main/java/fr/orbivia/accorps/PitchShifter.java tests/PitchShifterTest.java tests/AudioCoreTest.java tests/ScopeHistoryTest.java
          java -cp /tmp/audio-test AudioCoreTest
          java -cp /tmp/audio-test ScopeHistoryTest
          java -cp /tmp/audio-test PitchShifterTest
      - run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Show lint report on failure
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt || true
      - name: Save test APK release in private repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view accorps-test-0.7.0 >/dev/null 2>&1; then
            gh release edit accorps-test-0.7.0 --draft=false --latest=false --target "${{ github.sha }}" --title "AcCorps 0.7.0 — Android test"
            gh release upload accorps-test-0.7.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create accorps-test-0.7.0 app/build/outputs/apk/debug/app-debug.apk --draft=false --latest=false --target "${{ github.sha }}" --title "AcCorps 0.7.0 — Android test" --notes "Larger scope, quick heart/lungs presets, reorganized settings, experimental pitch transposition; original WAV preserved."
          fi
      - name: Verify APK checksum
        run: |
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
