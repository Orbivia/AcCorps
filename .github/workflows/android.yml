name: Android debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p /tmp/audio-test
          javac -d /tmp/audio-test app/src/main/java/fr/orbivia/accorps/Dsp.java app/src/main/java/fr/orbivia/accorps/Wav.java tests/AudioCoreTest.java
          java -cp /tmp/audio-test AudioCoreTest
      - run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Show lint report on failure
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt || true
      - name: Save private draft test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view accorps-test-0.3.0 >/dev/null 2>&1; then
            test "$(gh release view accorps-test-0.3.0 --json isDraft --jq .isDraft)" = true
            gh release edit accorps-test-0.3.0 --draft --target "${{ github.sha }}" --title "AcCorps 0.3.0 — Android test"
            gh release upload accorps-test-0.3.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create accorps-test-0.3.0 app/build/outputs/apk/debug/app-debug.apk --draft --target "${{ github.sha }}" --title "AcCorps 0.3.0 — Android test" --notes "English by default, PrintLeft light/dark theme, terms-of-use info bubble, realtime filters and raw WAV sessions. Hardware validation remains necessary."
          fi
