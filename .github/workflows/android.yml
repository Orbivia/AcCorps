name: Android debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p /tmp/audio-test
          javac -d /tmp/audio-test app/src/main/java/fr/orbivia/accorps/Dsp.java app/src/main/java/fr/orbivia/accorps/Wav.java tests/AudioCoreTest.java
          java -cp /tmp/audio-test AudioCoreTest
      - run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Show lint report on failure
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt || true
      - uses: actions/upload-artifact@v4
        with:
          name: AcCorps-0.1.0-debug
          path: app/build/outputs/apk/debug/*.apk
