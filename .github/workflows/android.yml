name: Android debug APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: |
          mkdir -p /tmp/audio-test
          javac -d /tmp/audio-test app/src/main/java/fr/orbivia/accorps/Dsp.java app/src/main/java/fr/orbivia/accorps/AudioChannels.java app/src/main/java/fr/orbivia/accorps/Wav.java app/src/main/java/fr/orbivia/accorps/ScopeHistory.java tests/AudioCoreTest.java tests/ScopeHistoryTest.java
          java -cp /tmp/audio-test AudioCoreTest
          java -cp /tmp/audio-test ScopeHistoryTest
      - run: gradle :app:assembleDebug :app:lintDebug --no-daemon
      - name: Show lint report on failure
        if: failure()
        run: cat app/build/reports/lint-results-debug.txt || true
      - name: Save private draft test APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view accorps-test-0.5.0 >/dev/null 2>&1; then
            test "$(gh release view accorps-test-0.5.0 --json isDraft --jq .isDraft)" = true
            gh release edit accorps-test-0.5.0 --draft --target "${{ github.sha }}" --title "AcCorps 0.5.0 — Android test"
            gh release upload accorps-test-0.5.0 app/build/outputs/apk/debug/app-debug.apk --clobber
          else
            gh release create accorps-test-0.5.0 app/build/outputs/apk/debug/app-debug.apk --draft --target "${{ github.sha }}" --title "AcCorps 0.5.0 — Android test" --notes "Temporary spiral launcher icon; second-order Butterworth filtering for Heart 20-400 Hz and Lungs 100-2000 Hz; selectable waveform/envelope display; existing channel routing and original WAV recording. Hardware validation remains necessary."
          fi
      - name: Prepare verified APK delivery
        run: |
          python3 - <<'PYAPK'
          import pathlib,hashlib,base64
          data=pathlib.Path('app/build/outputs/apk/debug/app-debug.apk').read_bytes()
          print('APK_SIZE:'+str(len(data)))
          print('APK_SHA256:'+hashlib.sha256(data).hexdigest())
          encoded=base64.b64encode(data).decode()
          for i,start in enumerate(range(0,len(encoded),8192)):
              print(f'APK_CHUNK_{i:03d}:'+encoded[start:start+8192])
          PYAPK
